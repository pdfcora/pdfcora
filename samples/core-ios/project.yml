name: CoreSample
options:
  bundleIdPrefix: com.pdfcora.samples
  deploymentTarget:
    iOS: "15.0"
packages:
  PDFCora:
    path: ../..
targets:
  CoreSample:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PDFCora
        product: PDFCora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfcora.samples.core
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDFCora Core
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
