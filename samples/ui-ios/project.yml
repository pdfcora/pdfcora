name: ViewerUI
options:
  bundleIdPrefix: com.pdfcora.samples
  deploymentTarget:
    iOS: "15.0"
packages:
  PDFCora:
    path: ../..
targets:
  ViewerUI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PDFCora
        product: PDFCora
      - package: PDFCora
        product: PDFCoraUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfcora.samples.ui
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDFCora UI
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
