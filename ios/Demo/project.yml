name: PDFCoraDemo
options:
  bundleIdPrefix: com.pdfcora
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  PDFCora:
    path: ../..
targets:
  PDFCoraDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: PDFCora
        product: PDFCora
      - package: PDFCora
        product: PDFCoraAI
      - package: PDFCora
        product: PDFCoraUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfcora.demo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PDFCora
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
  PDFCoraDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PDFCoraDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pdfcora.demo.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
