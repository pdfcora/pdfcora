name: android
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Fetch vendor artifacts
        run: ./scripts/fetch-vendor.sh
        env:
          PDFIUMKIT_ARTIFACTS: ${{ runner.temp }}/pdfium-artifacts
      - name: Build library
        run: cd android && ./gradlew :pdfiumkit:assembleDebug
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: cd android && ./gradlew :pdfiumkit:connectedDebugAndroidTest
