name: android
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The JVM tests and a native build of every ABI. The instrumented suite needs an
  # emulator, which is slow on hosted runners; scripts/test-android.sh runs it locally.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.2' }
      - uses: ./.github/actions/fetch-vendor
      - name: Build and run JVM tests
        run: |
          cd android
          gradle :pdfiumkit:assembleDebug :pdfiumkit:testDebugUnitTest \
            :pdfiumkit-ai:testDebugUnitTest --console=plain
