name: samples-sync
# Copies samples/ to the public github.com/pdfcora/samples, rewritten to use the released
# packages (scripts/export-samples.sh). It does nothing until the SAMPLES_DEPLOY_KEY
# secret exists: set it only once the packages are published, or the public samples
# would not build.
on:
  push:
    branches: [master]
    paths: ['samples/**', 'scripts/export-samples.sh', 'android/pdfcora/build.gradle.kts']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: samples-sync
jobs:
  sync:
    runs-on: macos-15
    env:
      DEPLOY_KEY: ${{ secrets.SAMPLES_DEPLOY_KEY }}
    steps:
      - name: Check the deploy key
        id: key
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "SAMPLES_DEPLOY_KEY is not set; nothing to do"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.set
      - name: Clone the public repository
        if: steps.key.outputs.set
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/samples && chmod 600 ~/.ssh/samples
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/samples -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:pdfcora/samples.git "$RUNNER_TEMP/samples"
      - name: Export
        if: steps.key.outputs.set
        run: |
          brew install xcodegen
          ./scripts/export-samples.sh "$RUNNER_TEMP/samples"
      - name: Push
        if: steps.key.outputs.set
        working-directory: ${{ runner.temp }}/samples
        run: |
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="PDFCora" -c user.email="samples@pdfcora.com" \
            commit -m "Sync from ${GITHUB_SHA::7}"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/samples" git push origin HEAD
