name: ios
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The SDK and AI unit suites. The demo app's UI tests take minutes of macOS time per run;
  # scripts/test-ios.sh runs them locally.
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: ./.github/actions/fetch-vendor
      - name: Pick a simulator
        run: |
          name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' )
          echo "DESTINATION=platform=iOS Simulator,name=$name" >> "$GITHUB_ENV"
          echo "using $name"
      - name: SDK tests
        run: |
          xcodebuild test -scheme PDFCora-Package -destination "$DESTINATION" \
            -only-testing:PDFCoraTests -skip-testing:PDFCoraTests/BlastRadiusTests \
            -skip-testing:PDFCoraTests/HangProbeTests
      - name: The hung-render suite, in its own process
        run: |
          xcodebuild test -scheme PDFCora-Package -destination "$DESTINATION" \
            -only-testing:PDFCoraTests/BlastRadiusTests
      - name: AI tests
        run: |
          xcodebuild test -scheme PDFCora-Package -destination "$DESTINATION" \
            -only-testing:PDFCoraAITests
