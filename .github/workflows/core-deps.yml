name: core-deps
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # PKG-2: the core must not gain an AI runtime, however indirectly. The check reads the
  # resolved graphs, so a transitive pull-in fails the build the same as a declared one.
  guard:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.2' }
      - uses: ./.github/actions/fetch-vendor
      - name: The core stays free of AI runtimes
        run: ./scripts/check-core-deps.sh
